name: bot
on:  
push:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y ffmpeg
      - run: pip install requests yt-dlp
      - run: python bot_telefon.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
